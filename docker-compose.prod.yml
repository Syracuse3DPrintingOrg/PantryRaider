# Production compose: runs the prebuilt image from GHCR, no local build needed.
#
#   curl -fsSL https://raw.githubusercontent.com/Syracuse3DPrintingOrg/PantryRaider/main/docker-compose.prod.yml -o docker-compose.yml
#   docker compose up -d
#   # then open http://YOUR-HOST:9284/setup
#
# Add backends with profiles, e.g.:
#   docker compose --profile with-grocy --profile with-mealie up -d
#
# Pin a version by setting PANTRYRAIDER_TAG (or FOODASSISTANT_TAG, the older
# name, which still works); defaults to latest. Published tags carry no leading
# "v": use the release number (e.g. 0.19.6) to freeze one build, or the minor
# line (e.g. 0.19) to keep picking up patch releases.

# Every container below keeps its log bounded with this one setting. Docker's
# json-file driver grows without limit by default, and on an SD card that is a
# slow write on every line and, eventually, a full card. Three files of 10 MB
# is weeks of normal output now that per-request access lines are off by
# default.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  service:
    image: ghcr.io/syracuse3dprintingorg/pantryraider:${PANTRYRAIDER_TAG:-${FOODASSISTANT_TAG:-latest}}
    container_name: foodassistant-service
    env_file:
      - path: .env
        required: false
    # PR_ACCESS_LOG=1 turns uvicorn's per-request log lines back on. They are
    # off by default because a kitchen screen polls every few seconds and on
    # a Pi each line is a write to the SD card; the app's own INFO lines and
    # the debug download are unaffected.
    environment:
      - TZ=${TZ:-America/New_York}
      # Lets the Updates page trigger an immediate update via the watchtower
      # service below. Same token as that service. WATCHTOWER_URL points at it on
      # the compose network; the app degrades gracefully if watchtower is off.
      - WATCHTOWER_URL=${WATCHTOWER_URL:-http://watchtower:8080}
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-foodassistant-update}
      # Optional label and document printing. Start the print service below
      #   docker compose --profile with-printing up -d
      # and add printers in the app (Settings, Printing). The app reaches the
      # print service through its socket in the shared cups-run volume, so
      # there is nothing to set here. Set CUPS_SERVER in .env only to use a
      # different print server.
      - CUPS_SERVER=${CUPS_SERVER:-/run/cups/cups.sock}
    volumes:
      - ./data:/app/data
      # The print service's socket (only the socket; the print configuration
      # stays inside the print container). Empty and harmless when printing is
      # off.
      - cups-run:/run/cups
    ports:
      # IPv4 only on purpose: an IPv6 visitor would otherwise reach the app
      # from the Docker network's own gateway and look like a device on your
      # home network.
      - "0.0.0.0:9284:8000"
    # Forager remote access runs a WireGuard tunnel inside this container, which
    # needs NET_ADMIN, /dev/net/tun and one sysctl. Those are NOT granted here,
    # so a default install runs with ordinary container privileges. Turn them on
    # only if you use Forager remote access, by adding the override file:
    #   docker compose -f docker-compose.yml -f docker-compose.forager.yml up -d
    # Without it the app says plainly that remote access is unavailable; nothing
    # else changes. An existing stack keeps whatever its own compose file grants.
    restart: unless-stopped
    logging: *default-logging
    # Watchtower only touches containers carrying both of these labels (see the
    # watchtower service below): the first opts this container in to updates,
    # the second ties it to this stack's own Watchtower. Grocy, Mealie and
    # Ollama carry neither, so enabling auto-updates never disturbs them.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=foodassistant"
    depends_on:
      grocy:
        condition: service_started
        required: false
    # "default" is the shared stack network (Grocy, Mealie, Ollama, Beszel).
    # "updater" carries only this container and watchtower, so the watchtower
    # control API is reachable from the app and from nothing else on the stack.
    # "printing" carries only this container and the print service, so nothing
    # else can reach the print service. See the networks block at the bottom of
    # this file.
    networks:
      - default
      - updater
      - printing

  grocy:
    # Pinned on purpose; see "Upgrading pinned images" in the README. Grocy
    # 4.7.0 moved AUTH_CLASS to Grocy\Middleware\Auth\DefaultAuthMiddleware,
    # and a config.php still naming the old class makes Grocy answer every API
    # call with an error page. The start-up self-heal mounted below rewrites
    # that line when Grocy starts, so a 4.6 install moves to this tag on its
    # own. Grocy upgrades its database on first start and cannot go back to 4.6
    # on the same data, so back up before the move. Before the next bump, check
    # that version's config-dist.php the same way.
    image: lscr.io/linuxserver/grocy:4.7.1
    container_name: foodassistant-grocy
    profiles: ["with-grocy"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./grocy:/config
      # Start-up self-heal (read-only). The LinuxServer image runs every
      # executable script in /custom-cont-init.d as root before Grocy comes
      # up; docker/grocy-init/10-repair-auth-class.sh fixes the AUTH_CLASS
      # line when a Grocy update moves it (backup first) and does nothing
      # otherwise.
      - ./docker/grocy-init:/custom-cont-init.d:ro
    ports:
      - "9383:80"
    restart: unless-stopped
    logging: *default-logging

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0   # pinned; see "Upgrading pinned images" in README
    container_name: foodassistant-mealie
    profiles: ["with-mealie"]
    environment:
      - TZ=${TZ:-America/New_York}
      - ALLOW_SIGNUP=false
      - BASE_URL=http://localhost:9285
    volumes:
      - ./mealie:/app/data
    ports:
      - "9285:9000"
    restart: unless-stopped
    logging: *default-logging

  ollama:
    image: ollama/ollama:0.40.4   # pinned; see "Upgrading pinned images" in README
    container_name: foodassistant-ollama
    profiles: ["with-ollama"]
    volumes:
      - ./ollama:/root/.ollama
    ports:
      # Only this machine can reach it (Ollama has no password). To use it from
      # other computers, change this to "11434:11434".
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    logging: *default-logging

  # Optional print service for labels and documents, started with:
  #   docker compose --profile with-printing up -d
  # Off by default. Add printers in the app (Settings, Printing): network
  # printers (IPP and driverless) and Zebra ZPL label printers are added by
  # address there. The print service has no port of its own on this machine or
  # on your network. The app reaches it through a socket in the shared
  # cups-run volume, or over the private printing network that only the two of
  # them join. Added printers persist in the cups-config volume. USB and
  # Bluetooth printers need the printer's device passed into this container
  # (uncomment the devices and privileged hints below).
  cups:
    image: olbat/cupsd@sha256:3a9d7c319f4153c87e16db4edb6ef6c317aa7e71f8abe65c3419cc9aca851194   # CUPS + cups-filters (rastertolabel); pinned. Our config is applied at start below.
    container_name: foodassistant-cups
    profiles: ["with-printing"]
    environment:
      - TZ=${TZ:-America/New_York}
    # At every start this writes the Pantry Raider print config (the same text
    # as docker/cups/cupsd.conf in the release this file came from), checks it
    # with cupsd -t, and only then puts it in place. A config that does not
    # pass the check never replaces the last good one, so the print service
    # always starts. It also locks the image's built-in "print" account, which
    # ships with a well-known password. Nothing is downloaded, and the Zebra
    # label driver comes with the app.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cat > /etc/cups/cupsd.conf.pantryraider <<'CUPSD'
        # Pantry Raider print service config.
        #
        # The compose file carries this exact text and writes it into the print
        # container at every start. It checks the text with "cupsd -t" first and keeps
        # the config already in place if the check fails, so a mistake here never stops
        # printing.
        #
        # Printers are added in the app (Settings, Printing). The print service has no
        # port of its own on this machine or your network: it listens on 631 only
        # inside the private printing network it shares with the app, and on a socket
        # the app reaches through the shared cups-run volume. That is why adding a
        # printer needs no password here. Never publish port 631, because anyone who
        # could reach it could add or remove printers.
        #
        # ServerAlias names the two addresses the app uses for this container. The
        # configuration and log files are readable only through the socket.
        # DefaultShared lets the app print over the private network as well as the
        # socket, which older app images use; Browsing Off keeps every printer
        # unadvertised.
        MaxLogSize 0
        LogLevel warn
        PageLogFormat
        ServerAlias cups foodassistant-cups
        Listen *:631
        Listen /run/cups/cups.sock
        Browsing Off
        DefaultShared Yes
        ErrorPolicy retry-job
        WebInterface No
        DefaultAuthType Basic
        <Location />
          Order allow,deny
          Allow @LOCAL
        </Location>
        <Location /admin>
          Order allow,deny
          Allow @LOCAL
        </Location>
        <Location /admin/conf>
          Order allow,deny
        </Location>
        <Location /admin/log>
          Order allow,deny
        </Location>
        <Policy default>
          JobPrivateAccess default
          JobPrivateValues default
          SubscriptionPrivateAccess default
          SubscriptionPrivateValues default
          <Limit Create-Job Print-Job Print-URI Validate-Job>
            Order deny,allow
          </Limit>
          <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
            Order deny,allow
          </Limit>
          <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
            Order deny,allow
            Allow @LOCAL
          </Limit>
          <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
            Order deny,allow
            Allow @LOCAL
          </Limit>
          <Limit Cancel-Job CUPS-Authenticate-Job>
            Order deny,allow
          </Limit>
          <Limit All>
            Order deny,allow
          </Limit>
        </Policy>
        CUPSD
        if /usr/sbin/cupsd -t -c /etc/cups/cupsd.conf.pantryraider; then
          mv -f /etc/cups/cupsd.conf.pantryraider /etc/cups/cupsd.conf
          echo 'Applied the Pantry Raider print service config'
        else
          rm -f /etc/cups/cupsd.conf.pantryraider
          echo 'WARN: the Pantry Raider print config did not validate; keeping the existing one'
        fi
        passwd -l print >/dev/null 2>&1 || true
        exec /usr/sbin/cupsd -f
    volumes:
      # A NAMED volume, not a bind mount: Docker seeds a fresh named volume from
      # the image's /etc/cups, so cupsd has its config and added queues persist.
      # A bind mount to an empty host dir would shadow the config and crash cupsd.
      - cups-config:/etc/cups
      # The print service's socket, shared with the app. Only the socket is
      # shared: the print configuration stays inside this container.
      - cups-run:/run/cups
    # No ports on purpose. Adding a printer needs no password here, so the
    # print service must never be reachable from your network. Manage printers
    # from Settings, Printing in the app.
    networks:
      - printing
    # USB / Bluetooth printer passthrough (best-effort; uncomment as needed):
    # devices:
    #   - "/dev/bus/usb:/dev/bus/usb"
    # privileged: true
    restart: unless-stopped
    logging: *default-logging

  # Automatic updates for the server (non-Pi) install, ON BY DEFAULT. A plain
  # server has no host bridge, so it cannot run the in-app one-button update the
  # Pi appliances use. Watchtower fills that gap: it watches the Pantry Raider
  # image on GHCR and, when a new version is published, pulls it and recreates
  # the service container (which brings in updated Python dependencies, since
  # they are baked into the image). New deps need no separate step.
  #
  # This is the maintained fork of Watchtower. The original
  # containrrr/watchtower was archived and cannot talk to Docker 29: there it
  # restarts over and over and never updates anything. The fork negotiates the
  # Docker API version when it starts, and works with Docker 24 or newer.
  #
  # Two settings keep it to Pantry Raider's own app container.
  # WATCHTOWER_LABEL_ENABLE means it only updates containers labeled
  # com.centurylinklabs.watchtower.enable=true (just the service above), so
  # Grocy, Mealie and Ollama stay on their pinned versions. WATCHTOWER_SCOPE,
  # with the matching scope label on the service and on this container, means
  # it only looks at this stack, so any Watchtower you already run, and the
  # containers it looks after, are left alone. Security note: Watchtower needs
  # the Docker socket, which is host-root-equivalent access. To turn
  # auto-updates OFF, stop this one service (docker compose stop watchtower)
  # or pin PANTRYRAIDER_TAG to a fixed version.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.23.1   # pinned; see "Upgrading pinned images" in README
    container_name: foodassistant-watchtower
    environment:
      - TZ=${TZ:-America/New_York}
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCOPE=foodassistant
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-86400}
      # Manual "Update now" support: the app posts to the HTTP API's update
      # endpoint to apply an update immediately instead of waiting for the
      # next poll. PERIODIC_POLLS keeps the scheduled daily check running
      # alongside the API (enabling the API alone would otherwise disable it).
      # The token is shared with the app service above so it can authenticate
      # the trigger.
      - WATCHTOWER_HTTP_API_ENDPOINTS=update
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-foodassistant-update}
    labels:
      - "com.centurylinklabs.watchtower.scope=foodassistant"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging: *default-logging
    # Only the app container shares this network, so the update API (and the
    # Docker socket behind it) is not reachable from Grocy, Mealie, Ollama,
    # CUPS or Beszel.
    networks:
      - updater

  # Optional Beszel monitoring hub (FoodAssistant-4kz2), a self-hosted
  # dashboard with history and graphs, richer than the built-in live
  # snapshot in Settings > Resources. Off by default; turn it on with:
  #   docker compose --profile with-beszel up -d
  # First run:
  #   1. Open http://THIS-HOST:8090 and create the admin account.
  #   2. Choose Add System and enter /beszel_socket/beszel.sock as the Host / IP
  #      (no port): the hub reaches the agent below through a socket in the
  #      shared ./beszel_socket folder, not over the network.
  #   3. Copy the Public Key the dialog shows into BESZEL_AGENT_KEY= in the
  #      .env next to this file, then add the system.
  #   4. Run docker compose --profile with-beszel up -d again so the agent
  #      starts with that key.
  # Paste the hub URL into Settings > Resources in the app to add the "Open
  # the Beszel dashboard" link there.
  beszel:
    image: henrygd/beszel:0.21.0   # pinned; check github.com/henrygd/beszel/releases before bumping
    container_name: foodassistant-beszel
    profiles: ["with-beszel"]
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - beszel-data:/beszel_data
      - ./beszel_socket:/beszel_socket
    ports:
      - "8090:8090"
    restart: unless-stopped
    logging: *default-logging

  # The Beszel agent reports this host's own metrics (not the container's) to
  # the hub above. It needs to see host processes, network and disks to do
  # that, so it runs with host networking and the host PID namespace and
  # reads the Docker socket (read-only) for per-container stats; treat it like
  # Watchtower's Docker socket requirement above, and opt in only if you want
  # this host monitored. It answers the hub on a socket in ./beszel_socket
  # rather than a network port. BESZEL_AGENT_KEY is the public key the hub
  # shows when you add this system; set it in .env rather than editing this
  # file. The agent does not start until it is set.
  beszel-agent:
    image: henrygd/beszel-agent:0.21.0   # pinned; check github.com/henrygd/beszel/releases before bumping
    container_name: foodassistant-beszel-agent
    profiles: ["with-beszel"]
    network_mode: host
    pid: host
    environment:
      - TZ=${TZ:-America/New_York}
      - LISTEN=/beszel_socket/beszel.sock
      - KEY=${BESZEL_AGENT_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_socket:/beszel_socket
      - beszel-agent-data:/var/lib/beszel-agent
    restart: unless-stopped
    logging: *default-logging

networks:
  # Private link between the app and watchtower. Watchtower holds the Docker
  # socket, so keeping it off the shared stack network means a compromise of any
  # other container on the stack has no route to it.
  updater:
    driver: bridge
  # Private link between the app and the print service. Adding a printer there
  # needs no password, so nothing else joins this network and the print
  # service publishes no port. It is an ordinary bridge, not an internal one,
  # so the print service can still reach the printers on your network.
  printing:
    driver: bridge

volumes:
  # Holds the print service's config and added printer queues so they survive
  # a container recreate (label printing, with-printing profile).
  cups-config:
  # The print service's socket, shared with the app (with-printing profile).
  cups-run:
  # Beszel hub's SQLite data + config (with-beszel profile).
  beszel-data:
  # The Beszel agent's own state (with-beszel profile). Named so a recreate
  # reuses it instead of leaving an unnamed volume behind each time.
  beszel-agent-data:

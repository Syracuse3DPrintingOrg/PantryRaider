# FoodAssistant Stream Deck controller configuration.
# Copy to config.toml and edit. Every value has a default, so a deck attached
# to a fresh appliance works with this file untouched as long as the app is on
# localhost without authentication.

# Where the FoodAssistant API lives. On the appliance this is the local app.
base_url = "http://localhost:9284"

# API key, only needed when authentication is enabled. Prefer setting this via
# the FOODASSISTANT_API_KEY environment variable (the systemd unit does) so it
# stays out of this file. The deck sends it only to base_url, never to a
# camera, Home Assistant or the kiosk browser.
api_key = ""

# Deck brightness on start, 5 to 100. The "brightness" key cycles through
# preset steps from there.
brightness = 60

# How often, in seconds, to refresh the counts on status keys.
poll_seconds = 30

# Items expiring within this many days count toward the "Expiring" key.
soon_days = 7

# The nav keys (Add, Stock, Cook) open their page on the kitchen screen
# through the kiosk's navigation socket. The screen stays signed in, and its
# browser needs no open debugging port.
kiosk_nav_socket = "/run/foodassistant-kiosk/nav.sock"

# Optional fallback for a screen without the navigation socket: the Chrome
# DevTools endpoint of a local kiosk browser, for example
# "http://localhost:9222". When neither answers, the nav keys use the desktop
# opener. Leave empty to skip it. On a Pantry Raider kitchen screen the
# debugging port stays closed until you run
# "sudo foodassistant-kiosk-devtools on", for example to profile the browser.
kiosk_cdp_url = ""

# Set by Pantry Raider, not by hand. At 1, a Home Assistant key that unlocks
# a door, disarms an alarm, opens a garage or does something similar runs
# only after you allow it in Settings, Start Page; until then it shows
# "Needs OK" and does nothing. At 0 every working key keeps running.
ha_policy_version = 0

# Clockwise rotation of the rendered key faces, in degrees. Only 0, 90, 180,
# and 270 are accepted (anything else falls back to 0). Use 180 if the deck is
# mounted upside down; key presses are remapped to match. The HDMI/kiosk
# display rotation is a separate OS-level setting (xrandr / KMS).
rotation = 0

# Keys, in order, left to right and top to bottom. Trimmed to fit a smaller
# deck; on a 6-key Mini any overflow moves to extra pages reached by a "More"
# key. Remove keys you do not want, or reorder freely.
#
# Available actions:
#   expiring    live count of items expired or expiring soon (press to refresh)
#   pending     live count of scans waiting to commit (press to refresh)
#   commit      commit every pending scan into inventory
#   add         open the add-item page on the attached display
#   inventory   open the inventory dashboard on the attached display
#   cook        open the recipe suggestions page on the attached display
#   brightness  cycle deck brightness
#   pin         turn the deck into a numeric keypad to unlock the PIN-locked
#               app, then return to the normal layout (handy with no keyboard
#               or touchscreen). Entered digits are shown masked, never as the
#               actual code.
keys = [
  "expiring",
  "pending",
  "commit",
  "add",
  "inventory",
  "cook",
  "brightness",
]

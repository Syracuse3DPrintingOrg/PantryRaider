# Pantry Raider boot screen (FoodAssistant-y8vj).
# getty resets its terminal when it starts (TTYReset), which switches tty1
# back to text mode and clears it for the login prompt, right over the boot
# screen. Wait for the boot screen to end first; by then the kiosk has moved
# to its own VT and tty1 is in the background.
#
# A kiosk device never shows a login prompt on tty1 (the kiosk used to hold
# tty1 for that reason); the other consoles keep theirs.
[Unit]
After=foodassistant-boot-splash.service
ConditionPathExists=!/etc/systemd/system/foodassistant-kiosk.service

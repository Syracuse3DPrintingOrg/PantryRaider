name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Both interpreters, with the pinned service/requirements.txt: 3.12 is what
    # the shipped image runs, 3.11 is what a Debian bookworm box installs, and
    # this is the only job that exercises the real dependency set. tests.yml
    # deliberately covers something else (the minimal import-time floor).
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # The app creates its data dir at import time (database.py). The default
    # /app/data is not writable on the runner, so point it at a writable path.
    env:
      DATA_DIR: /tmp/foodassistant-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt
          pip install ruff pytest pytest-cov anyio

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: python -m pytest tests/ -q --cov=service/app --cov-report=term-missing

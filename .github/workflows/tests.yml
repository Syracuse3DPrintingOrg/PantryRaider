name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # 3.12 only, and on purpose. This job pins the MINIMAL import-time floor
    # (the hand-picked list below), while ci.yml installs the pinned
    # service/requirements.txt across 3.11 and 3.12. Two different questions:
    # "does the app still import with almost nothing installed" and "does the
    # shipped dependency set work on both interpreters".
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    # The app creates its data dir at import time (database.py). The default
    # /app/data is not writable on the runner, so point it at a writable path.
    env:
      DATA_DIR: /tmp/foodassistant-data
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is pure logic: only the import-time dependencies of the app
      # are needed, no Grocy, Mealie, Docker, or network.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi jinja2 itsdangerous pillow python-multipart \
            sqlalchemy pydantic-settings httpx pytest "qrcode[pil]" pyyaml

      - name: Import smoke test
        run: python -c "import sys; sys.path.insert(0,'service'); from app.main import app"

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

  cloud-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # 3.12 is what cloud/Dockerfile runs, so CI matches production.
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # The Forager suite is self-contained: in-memory SQLite and a stubbed AI
      # upstream, no Postgres and no network. The tests call asyncio.run
      # directly, so no async pytest plugin is needed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/requirements.txt pytest

      # No paths filter here on purpose: a change in shared code must not be
      # able to skip this suite.
      - name: Tests (Forager cloud companion)
        working-directory: cloud
        run: python -m pytest -q

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Syntax-check every shell script, including the extensionless
      # provisioning helpers (two of those are Python, so dispatch on the
      # shebang instead of assuming bash).
      - name: Shell syntax (bash -n)
        run: |
          set -e
          for f in scripts/*.sh scripts/image-build/*.sh scripts/image-build/foodassistant-*; do
            case "$f" in *.service) continue ;; esac
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -q python; then
              python3 -m py_compile "$f"
            else
              bash -n "$f"
            fi
            echo "ok: $f"
          done

      # Node is preinstalled on ubuntu runners. Two explicit globs, not a
      # recursive sweep: the setup wizard's panes sit one level down and were
      # going unchecked, while static/js/vendor/ is third-party code that must
      # never be able to fail this job.
      - name: JavaScript syntax (node --check)
        run: |
          set -e
          for f in service/app/static/js/*.js service/app/static/js/setup/*.js; do
            node --check "$f"
            echo "ok: $f"
          done

  browser:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: /tmp/foodassistant-browser-data
      # Without this the suite skips itself when Playwright or Chromium is
      # missing, which is how it went unrun in CI for its whole life. Here the
      # browser is installed on purpose, so a missing one is a broken job.
      REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # The mock stack boots the real app as a uvicorn subprocess, so this job
      # needs the full pinned stack, not the import-time floor the pytest job
      # installs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt
          pip install pytest playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Grocy and Mealie are stubbed by tests/browser/_mockstack.py, so this
      # still needs no Docker and no network.
      - name: Tests (headless browser)
        run: python -m pytest tests/browser -q -m browser

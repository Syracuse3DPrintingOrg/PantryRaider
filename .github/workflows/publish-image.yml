name: Publish container image

# Builds the Pantry Raider service image and publishes it to the GitHub
# Container Registry (GHCR) so users can run the app without building locally.
# A signed release tag (vX.Y.Z) publishes :X.Y.Z and :X.Y, and moves :latest
# only when it is the highest release tag; pushes to main refresh :main and
# never touch :latest. A version already in GHCR is never pushed again, so the
# digest scripts/sign-release.sh records for a release stays the one devices
# pull. Run manually from the Actions tab via workflow_dispatch.
#
# IMPORTANT: package visibility
# After this workflow pushes the image for the first time, the package defaults
# to private. Appliance devices cannot pull it without auth until it is made
# public. To fix: go to the repo on GitHub -> Packages -> foodassistant ->
# Package settings -> Change visibility -> Public. This is a one-time UI click
# that cannot be automated here. The firstboot.sh provisioner will fall back to
# building from local source if the pull fails, but making the package public is
# the recommended path for zero-friction appliance deploys.

# No release trigger: publishing a GitHub Release after the tag run used to
# build and push the version tag a second time, after its digest was signed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Pinned EXPLICITLY, never derived from github.repository: a GHCR package
  # does not follow repo renames or transfers, and deriving the name once
  # silently published to a package the fleet never pulls, so devices stopped
  # updating. The canonical image is the org-owned
  # ghcr.io/syracuse3dprintingorg/pantryraider. Deployed devices that still
  # reference the legacy personal-account image
  # (ghcr.io/syracuse3dprinting/foodassistant) are migrated by
  # foodassistant-update, which rewrites the image line in their compose file
  # on the next update.
  #
  # NOTE 1: after the FIRST publish to a new package, set its visibility to
  # Public (org -> Packages -> pantryraider -> Package settings), or appliance
  # devices cannot pull it.
  # NOTE 2: the build job below is gated on the repository name, and that gate
  # (not the token) is what keeps the private dev repo out of the fleet's
  # image. GITHUB_TOKEN in the dev repo cannot write this org package, so every
  # dev push used to spend about seven minutes on a multi-arch QEMU build only
  # to fail at the push step. Publishing happens where the public repo lives.
  # NOTE 3: pushes made by other workflows with GITHUB_TOKEN (e.g. Brand sync)
  # do not trigger this workflow. After such a push, run it manually from the
  # Actions tab (workflow_dispatch) if the image needs the change.
  IMAGE_NAME: syracuse3dprintingorg/pantryraider

jobs:
  # Every release tag can move :latest, the tag Compose and Unraid installs
  # follow, and every push to main refreshes :main, so the suite has to pass
  # before an image goes out. Gated like the build below: the dev repo runs
  # the same suite in ci.yml and tests.yml.
  test:
    if: github.repository == 'Syracuse3DPrintingOrg/PantryRaider'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The app creates its data dir at import time (database.py). The default
    # /app/data is not writable on the runner, so point it at a writable path.
    env:
      DATA_DIR: /tmp/foodassistant-data
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt -r requirements-dev.txt

      - name: Tests (pytest)
        run: python -m pytest tests/ -q -n auto

  # Nothing is built or pushed from a ref the release key did not sign: a tag
  # must be a signed annotated tag, any other ref (a push to main, a manual
  # run) a signed commit. The check and the pinned keys live in
  # verify-release-signature.yml, shared with the other publishing workflows.
  verify-signature:
    if: github.repository == 'Syracuse3DPrintingOrg/PantryRaider'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-signature.yml
    with:
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}

  build-and-push:
    needs: [test, verify-signature]
    # Only the public repo publishes. Gating the WHOLE job, not just the push
    # step: a build-only run in the dev repo would burn the same QEMU minutes
    # for an image nobody pulls.
    if: github.repository == 'Syracuse3DPrintingOrg/PantryRaider'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing the provenance attestation below: a workload identity token
      # for Sigstore, and write access to store the attestation. attest v4
      # also records the pushed image as a storage record, which needs
      # artifact-metadata.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Which tags this run may publish. :latest follows only the highest
      # vX.Y.Z tag on this repository, so a patch to an older line never moves
      # it backwards and main never moves it at all. A version that is already
      # in GHCR is not built again: its digest may already be signed into the
      # release's release.json, so a re-run attests the recorded digest
      # instead of replacing it.
      - name: Decide the tags
        id: decide
        env:
          REF: ${{ github.ref }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          latest=false
          skip=false
          digest=""
          tag="${REF#refs/tags/}"
          if [ "$tag" != "$REF" ] && [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            highest="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
              | awk '{ sub("^refs/tags/", "", $2); print $2 }' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V | tail -n 1)"
            if [ "$tag" = "$highest" ]; then
              latest=true
            fi
            err="$(mktemp)"
            if found="$(docker buildx imagetools inspect "$IMAGE:${tag#v}" \
                --format '{{json .Manifest}}' 2>"$err")"; then
              # The index digest, the one release.json records (not a
              # per-architecture manifest).
              digest="$(printf '%s' "$found" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("digest", ""))' 2>/dev/null || true)"
              if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::$IMAGE:${tag#v} exists but its digest could not be read."
                exit 1
              fi
              skip=true
              echo "$IMAGE:${tag#v} is already published as $digest; it will not be pushed again."
            elif ! grep -qiE 'not found|manifest unknown' "$err"; then
              # Only a registry that says the version is missing may lead to a
              # build. Any other failure (a timeout, an auth error) could hide
              # a version that is already signed, so stop and let a re-run
              # ask again.
              echo "::error::Could not tell whether $IMAGE:${tag#v} is already published: $(head -c 500 "$err" | tr '\n' ' ')"
              exit 1
            fi
            echo "Highest release tag: ${highest:-none}. $tag moves latest: $latest."
          fi
          {
            echo "latest=$latest"
            echo "skip=$skip"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The action adds :latest to every semver tag on its own unless told
          # not to; the decide step above is the only thing that sets it.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ steps.decide.outputs.latest == 'true' }}

      - name: Build and push
        id: build
        if: steps.decide.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # Repo root, not ./service: the image needs gadgets/ alongside the
          # app. Root .dockerignore keeps the context small.
          context: .
          file: ./service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Record how the image was built, in full. Additive: it rides along
          # in the image index, and docker pull ignores it, so nothing changes
          # for a device.
          provenance: mode=max

      # A signed, publicly verifiable statement of which commit and which
      # workflow produced this exact digest:
      #   gh attestation verify oci://ghcr.io/syracuse3dprintingorg/pantryraider:latest \
      #     --repo Syracuse3DPrintingOrg/PantryRaider
      # When the version was already published, the recorded digest is attested
      # instead, so a re-run after a half-finished release still leaves one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest || steps.decide.outputs.digest }}
          push-to-registry: true

name: Publish container image

# Builds the Pantry Raider service image and publishes it to the GitHub
# Container Registry (GHCR) so users can run the app without building locally.
# Tag a release (e.g. v1.0.0) to publish a versioned image; pushes to main
# refresh the :main tag. Run manually from the Actions tab via workflow_dispatch.
#
# IMPORTANT: package visibility
# After this workflow pushes the image for the first time, the package defaults
# to private. Appliance devices cannot pull it without auth until it is made
# public. To fix: go to the repo on GitHub -> Packages -> foodassistant ->
# Package settings -> Change visibility -> Public. This is a one-time UI click
# that cannot be automated here. The firstboot.sh provisioner will fall back to
# building from local source if the pull fails, but making the package public is
# the recommended path for zero-friction appliance deploys.

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Pinned EXPLICITLY, never derived from github.repository: a GHCR package
  # does not follow repo renames or transfers, and deriving the name once
  # silently published to a package the fleet never pulls, so devices stopped
  # updating. The canonical image is the org-owned
  # ghcr.io/syracuse3dprintingorg/pantryraider. Deployed devices that still
  # reference the legacy personal-account image
  # (ghcr.io/syracuse3dprinting/foodassistant) are migrated by
  # foodassistant-update, which rewrites the image line in their compose file
  # on the next update.
  #
  # NOTE 1: after the FIRST publish to a new package, set its visibility to
  # Public (org -> Packages -> pantryraider -> Package settings), or appliance
  # devices cannot pull it.
  # NOTE 2: the build job below is gated on the repository name, and that gate
  # (not the token) is what keeps the private dev repo out of the fleet's
  # image. GITHUB_TOKEN in the dev repo cannot write this org package, so every
  # dev push used to spend about seven minutes on a multi-arch QEMU build only
  # to fail at the push step. Publishing happens where the public repo lives.
  # NOTE 3: pushes made by other workflows with GITHUB_TOKEN (e.g. Brand sync)
  # do not trigger this workflow. After such a push, run it manually from the
  # Actions tab (workflow_dispatch) if the image needs the change.
  IMAGE_NAME: syracuse3dprintingorg/pantryraider

jobs:
  # Every push to main refreshes :latest, the tag Compose and Unraid installs
  # follow, so the suite has to pass before an image goes out. Gated like the
  # build below: the dev repo runs the same suite in ci.yml and tests.yml.
  test:
    if: github.repository == 'Syracuse3DPrintingOrg/PantryRaider'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The app creates its data dir at import time (database.py). The default
    # /app/data is not writable on the runner, so point it at a writable path.
    env:
      DATA_DIR: /tmp/foodassistant-data
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt pytest anyio pyyaml

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

  build-and-push:
    needs: test
    # Only the public repo publishes. Gating the WHOLE job, not just the push
    # step: a build-only run in the dev repo would burn the same QEMU minutes
    # for an image nobody pulls.
    if: github.repository == 'Syracuse3DPrintingOrg/PantryRaider'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing the provenance attestation below: a workload identity token
      # for Sigstore, and write access to store the attestation. attest v4
      # also records the pushed image as a storage record, which needs
      # artifact-metadata.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Nothing is built or pushed from a ref the release key did not sign. A
      # tag must be an annotated tag object signed by a key in
      # scripts/release-signers, named for the ref, pointing at the checked-out
      # commit, with a matching APP_VERSION. Any other ref (a push to main, a
      # manual run) needs a signed HEAD commit.
      - name: Verify the release signature
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          signers=scripts/release-signers

          # The release key is pinned here too. Otherwise a pushed commit could
          # add its own key to scripts/release-signers and vouch for itself;
          # this way, trusting another key also means editing this workflow.
          pinned='pantryraider-release namespaces="git,pantryraider-release" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHPWzaAihzRx7Y9JlXotaZfO0drDTOT/lXxvoePF82rd'
          if [ "$({ grep -vE '^[[:space:]]*(#|$)' "$signers" || true; })" != "$pinned" ]; then
            echo "::error::$signers does not match the release key pinned in this workflow."
            exit 1
          fi

          # Check a raw tag object: split it at its last SSH signature block
          # (as git does), verify the payload with ssh-keygen, and require the
          # tag's own name to be $2. Needs only ssh-keygen, no git.
          verify_tag_object() {
            local obj="$1" want="$2" signers="$3" dir n name
            dir="$(mktemp -d)"
            n="$({ grep -n -x -e '-----BEGIN SSH SIGNATURE-----' "$obj" || true; } | tail -n 1 | cut -d: -f1)"
            if [ -z "$n" ]; then
              echo "::error::Tag $want carries no SSH signature."
              return 1
            fi
            head -n "$((n - 1))" "$obj" > "$dir/payload"
            tail -n "+$n" "$obj" > "$dir/sig"
            if ! ssh-keygen -Y verify -f "$signers" -I pantryraider-release -n git \
                -s "$dir/sig" < "$dir/payload"; then
              echo "::error::Tag $want is not signed by a key in $signers."
              return 1
            fi
            name="$(awk 'NF == 0 { exit } /^tag / { print substr($0, 5) }' "$dir/payload")"
            if [ "$name" != "$want" ]; then
              echo "::error::The signed tag is named '$name', not '$want'."
              return 1
            fi
          }

          case "$REF" in
            refs/tags/*)
              tag="${REF#refs/tags/}"
              # actions/checkout can hand over a lightweight ref, so fetch the
              # tag object itself and insist that it is one.
              git fetch --no-tags --depth=1 origin "+$REF:$REF"
              if [ "$(git cat-file -t "$REF")" != tag ]; then
                echo "::error::$tag is not an annotated tag."
                exit 1
              fi
              obj="$(mktemp)"
              git cat-file tag "$REF" > "$obj"
              verify_tag_object "$obj" "$tag" "$signers"
              if [ "$(git rev-parse "$REF^{commit}")" != "$(git rev-parse HEAD)" ]; then
                echo "::error::The checked-out commit is not the one $tag points at."
                exit 1
              fi
              version="$(grep -oE 'APP_VERSION = "[0-9.]+"' service/app/config.py | grep -oE '[0-9.]+')"
              if [ "v$version" != "$tag" ]; then
                echo "::error::$tag does not match APP_VERSION $version."
                exit 1
              fi
              echo "Tag $tag verified against $signers."
              ;;
            *)
              if ! git -c gpg.ssh.allowedSignersFile="$signers" verify-commit HEAD; then
                echo "::error::HEAD is not signed by a key in $signers."
                exit 1
              fi
              echo "Commit $(git rev-parse --short HEAD) verified against $signers."
              ;;
          esac

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # Repo root, not ./service: the image needs gadgets/ alongside the
          # app. Root .dockerignore keeps the context small.
          context: .
          file: ./service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Record how the image was built, in full. Additive: it rides along
          # in the image index, and docker pull ignores it, so nothing changes
          # for a device.
          provenance: mode=max

      # A signed, publicly verifiable statement of which commit and which
      # workflow produced this exact digest:
      #   gh attestation verify oci://ghcr.io/syracuse3dprintingorg/pantryraider:latest \
      #     --repo Syracuse3DPrintingOrg/PantryRaider
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

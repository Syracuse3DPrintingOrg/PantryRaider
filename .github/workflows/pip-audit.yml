name: Dependency audit

# Reports known vulnerabilities in every pinned Python dependency set (the app,
# the Forager cloud companion, the gadgets reader, the Stream Deck controller).
#
# Deliberately weekly and report-only, never a gate on push or a pull request:
# an upstream advisory with no fixed release would otherwise wedge every commit
# and every release until someone else shipped a patch. Read the run summary,
# then decide. Findings that matter become a bead.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # continue-on-error, on purpose: a finding is information, not a failure.
      - name: Audit pinned requirements
        continue-on-error: true
        run: |
          echo "## Dependency audit" >> "$GITHUB_STEP_SUMMARY"
          for f in service/requirements.txt cloud/requirements.txt \
                   gadgets/requirements.txt streamdeck/requirements.txt; do
            [ -f "$f" ] || continue
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            pip-audit -r "$f" --progress-spinner off 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

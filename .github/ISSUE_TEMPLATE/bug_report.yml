name: Bug report
description: Report a problem with Pantry Raider
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do not use this form for
        security vulnerabilities. See SECURITY.md for private disclosure.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings, Backups & Updates shows it.
      placeholder: "0.21.0"
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: How is Pantry Raider installed?
      options:
        - Docker Compose
        - Unraid
        - Home Assistant add-on
        - Raspberry Pi SD image
        - install.sh
        - Bandit (a remote screen that follows a main server)
    validations:
      required: true
  - type: checkboxes
    id: profiles
    attributes:
      label: Optional profiles enabled
      description: Which optional Docker Compose profiles are enabled? Skip this for the Home Assistant add-on and Bandits.
      options:
        - label: Grocy (with-grocy)
        - label: Mealie (with-mealie)
        - label: Ollama (with-ollama)
        - label: Printing (with-printing)
        - label: Beszel (with-beszel)
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the behavior, what you expected, and what actually happened.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Any relevant logs, error output, or screenshots. Remove API keys, passwords and the setup code before posting. This will be rendered automatically, no backticks needed.
      render: shell
    validations:
      required: false

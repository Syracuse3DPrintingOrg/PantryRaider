<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{ ingress_path }}/">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="static/css/screen.css?v={{ app_version }}">
</head>
{# Shown to a tablet or wall screen whose sign-in ticket was missing, used or
   out of date. No form: the screen's app asks for a new ticket. #}
<body data-page="reconnect">
  <div class="sc-main sc-reconnect">
    <div class="sc-empty">
      <h1 class="sc-title">This screen needs to reconnect</h1>
      <p>It will show recipes and timers again once its app has reconnected to Pantry Raider.</p>
    </div>
  </div>
</body>
</html>
